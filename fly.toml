# fly.toml - Fly.io configuration for Cross Talk

app = 'cross-talk'
primary_region = 'sjc'

[build]

[env]
  NODE_ENV = 'production'
  DATABASE_PATH = '/data/crosstalk.db'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'crosstalk_data'
  destination = '/data'
